<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Memory</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-star"></i> Memory Match <i class="fas fa-star"></i> </h1>
            <div class="stats">
                <div class="stat">
                     <div class="stat-label">Moves</div>
                     <div class="stat-label">0</div>
                </div>

                <div class="stat">
                     <div class="stat-label">Time</div>
                     <div class="stat-label">0:00</div>
                </div>

                <div class="stat">
                     <div class="stat-label">Matches</div>
                     <div class="stat-label">0/18</div>

                </div>
            </div>
        </div>



        <div class="game-board" id="gameBoard"></div>
            <div class ="card">
                <div class="card-front"><i class="fas fa-spider"></i></div>
                 <div class="card-back"><img src="" alt=""></i></div>
            </div>
        <div class="controls"></div>
            <button class="btn" onclick="newGame()">
                <i class="fas fa-redo"></i> New Game 
            </button>
    </div>
    <div class="modal" id="winModal">
        <div class="modal-content">
            <h2><i class="fas fa-trophy"></i>  You Won! <i class="fas fa-trophy"></i> </h2>
            <p>Moves: <span id="finalMoves"></span><br>Time: <span id="finalTime"></span></p>
            <button class="btn" onclick="newGame()">Play Again</button>
        </div>
    </div>


    <script src="game.js"></script>
    
</body>
</html>
